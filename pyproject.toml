[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "me5412-fogguard"
version = "0.1.0"
description = "IMU冻结与转向感知、反馈驱动提示及离线评估原型"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fogguard.presentation" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
