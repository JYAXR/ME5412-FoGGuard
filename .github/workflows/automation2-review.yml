name: Automation 2 review checks

on:
  pull_request:
  push:
    branches: [feat/automation2-review-and-recognition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt -c docs/automation2/tested-constraints.txt
          python -m pip install -e .
      - name: Tests, lint, baseline audit and complete demo
        run: python -X utf8 scripts/run_automation2_delivery_checks.py
