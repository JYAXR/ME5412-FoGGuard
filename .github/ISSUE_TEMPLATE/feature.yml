    id: outcome
    attributes:
      label: 预期结果
      description: 描述可观察的结果，而不只是要做的活动。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收项
      value: |
        - [ ]
        - [ ]
