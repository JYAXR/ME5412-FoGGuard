name: 项目任务
description: FoGGuard 模块交付与验收任务
title: "[任务] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
      description: 描述可观察的结果，而不只是要做的活动。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收项
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: owner_role
    attributes:
      label: 负责模块
      options:
        - A1 冻结识别
        - A2 转向与感知融合
        - B1 运动反馈与提示控制
        - B2 评估与联调
        - 工业设计 PPT与最终展示
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: 交付里程碑
      options:
        - M1 冻结算法交付
        - M2 感知与反馈分别可用
        - M3 四模块联调
        - M4 统一评估
        - M5 最终展示
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: 接口或依赖
      description: 列出上游输入和下游使用方。
